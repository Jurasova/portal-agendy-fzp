<script>
(async function(){
"use strict";
const frame=document.getElementById("portal"), error=document.getElementById("error");
const decode=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
const text=bytes=>new TextDecoder("utf-8").decode(bytes);
const escapeHtml=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let current="", assets;
function route(){
 const hash=location.hash.slice(1);
 if(hash.startsWith("/")){
  const value=hash.slice(1),pos=value.indexOf("#");
  return {path:pos<0?value:value.slice(0,pos),anchor:pos<0?"":value.slice(pos+1)};
 }
 return {path:"index.html",anchor:hash};
}
function installBridge(config){
 const page=config.page, initial=config.initial;
 function reveal(id){
  let target;try{target=document.getElementById(decodeURIComponent(id))}catch(_){return}
  if(!target)return;
  for(let p=target;p;p=p.parentElement){if(p.tagName==="DETAILS")p.open=true}
  target.scrollIntoView({block:"start"});
 }
 window.addEventListener("message",e=>{if(e.source===parent&&e.data&&e.data.type==="portal-scroll")reveal(e.data.anchor)});
 document.addEventListener("click",e=>{
  const a=e.target.closest("a[href]");
  if(!a||e.button!==0||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey||a.dataset.portalPath===undefined)return;
  e.preventDefault();parent.postMessage({type:"portal-nav",path:a.dataset.portalPath,anchor:a.dataset.portalAnchor||""},"*");
 });
 document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll("a[href]").forEach(a=>{
   const raw=a.getAttribute("href");
   if(!raw||raw.startsWith("//")||/^[a-z][a-z0-9+.-]*:/i.test(raw))return;
   const at=raw.indexOf("#"),path=at<0?raw:raw.slice(0,at),anchor=at<0?"":raw.slice(at+1);
   a.dataset.portalPath=path||page;a.dataset.portalAnchor=anchor;
   a.href=parent.location.href.split("#")[0]+"#/"+(path||page)+(anchor?"#"+anchor:"");
  });
  if(initial)requestAnimationFrame(()=>reveal(initial));
  parent.postMessage({type:"portal-ready",title:document.title,page:page},"*");
 });
}
function bridge(path,anchor){return "("+installBridge.toString()+")("+JSON.stringify({page:path,initial:anchor})+");";}
function show(){
 const dest=route(),asset=assets[dest.path];
 if(!asset){error.hidden=false;error.textContent="Tato stránka není v portálu. Vraťte se na úvod.";return;}
 error.hidden=true;
 if(current===dest.path){frame.contentWindow.postMessage({type:"portal-scroll",anchor:dest.anchor},"*");return;}
 current=dest.path;
 let html=text(decode(asset.data));
 if(!dest.path.endsWith(".html")){
  html="<!doctype html><html lang=\"cs\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>"+escapeHtml(dest.path.split("/").pop())+" · AI v agendách FŽP</title></head><body style=\"margin:2rem auto;padding:0 1.5rem;max-width:70rem;font:16px/1.6 system-ui;color:#203d34;background:#f5f2eb\"><a href=\"index.html\">← Zpět do portálu</a><h1>"+escapeHtml(dest.path.split("/").pop())+"</h1><pre style=\"white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:1.5rem;border-radius:12px\">"+escapeHtml(html)+"</pre></body></html>";
 }
 const css=text(decode(assets["portal.css"].data));
 const js=text(decode(assets["portal.js"].data));
 html=html.replace(/<link\b[^>]*href=["']portal\.css["'][^>]*>/i,()=>"<style>"+css+"</style>");
 html=html.replace(/<script\b[^>]*src=["']portal\.js["'][^>]*><\/script>/i,()=>"<script>document.addEventListener('DOMContentLoaded',function(){\n"+js+"\n});<"+"/script>");

 frame.srcdoc=html;
}
function download(path){
 const asset=assets[path];if(!asset)return;
 const bytes=decode(asset.data),url=URL.createObjectURL(new Blob([bytes],{type:asset.mime}));
 const a=document.createElement("a");a.href=url;a.download=path.split("/").pop();document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
try{
 if(!window.DecompressionStream)throw new Error("Váš prohlížeč nepodporuje otevření tohoto balíčku. Použijte aktuální Edge nebo Chrome.");
 const raw=decode(document.getElementById("portal-data").textContent.trim());
 const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"));
 assets=JSON.parse(await new Response(stream).text());
 window.addEventListener("hashchange",show);
 window.addEventListener("message",e=>{
  if(e.source!==frame.contentWindow||!e.data)return;
  const d=e.data;
  if(d.type==="portal-ready"){document.title=d.title;return;}
  if(d.type!=="portal-nav"||typeof d.path!=="string"||!Object.hasOwn(assets,d.path))return;
  if(/\.(md|txt)$/.test(d.path)){download(d.path);return;}
  if(!d.path.endsWith(".html"))return;
  const next="#/"+d.path+(d.anchor?"#"+d.anchor:"");
  if(location.hash===next)show();else location.hash=next;
 });
 frame.hidden=false;document.getElementById("loading").remove();show();
}catch(e){error.hidden=false;error.textContent="Portál se nepodařilo otevřít. "+e.message;document.getElementById("loading").hidden=true;}
})();
</script></body></html>
